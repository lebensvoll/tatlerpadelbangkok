<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tatler Padel Series Bangkok — Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #030f0b; --bg-1: #082a1e; --bg-2: #0d3a2b;
  --panel: rgba(255,255,255,.05); --panel-2: rgba(255,255,255,.08); --panel-3: rgba(255,255,255,.13);
  --border: rgba(255,255,255,.15);
  --cream: #f4efe1; --cream-text: #2a3b30;
  --lime: #c8ea67; --lime-deep: #a9d43e; --lime-text: #e2f4ae;
  --text-primary: #f6f8f1; --text-secondary: #bcd0c1; --text-muted: #7fa08c;

  --male: #4fa8e0; --male-bg: rgba(79,168,224,.16); --male-border: rgba(79,168,224,.42); --male-text: #a9d8f0;
  --female: #e85c8a; --female-bg: rgba(232,92,138,.16); --female-border: rgba(232,92,138,.44); --female-text: #f5b8cf;

  --gold: #d9b23c; --gold-bg: rgba(217,178,60,.17); --gold-border: rgba(217,178,60,.44);
  --silver: #c3cdd0; --silver-bg: rgba(195,205,208,.15); --silver-border: rgba(195,205,208,.38);
  --bronze: #c98a54; --bronze-bg: rgba(201,138,84,.17); --bronze-border: rgba(201,138,84,.42);

  --live: #8fe36b; --live-bg: rgba(143,227,107,.14); --live-border: rgba(143,227,107,.42);
  --walkover: #ff9a9a; --walkover-bg: rgba(255,138,138,.16);

  --radius: 12px;
  --shadow: 0 8px 28px -14px rgba(0,0,0,.55);
  --font-display: 'Anton', 'Barlow Condensed', sans-serif;
  --font-ui: 'Barlow Condensed', -apple-system, sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body {
  font-family: var(--font-body);
  background: var(--bg-0);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  position: relative;
}
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle at 8% 10%, rgba(79,209,196,.22), transparent 40%),
    radial-gradient(circle at 94% 14%, rgba(20,130,100,.20), transparent 42%),
    radial-gradient(circle at 15% 92%, rgba(120,200,170,.12), transparent 40%),
    radial-gradient(circle at 88% 90%, rgba(68,105,90,.16), transparent 42%),
    linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-2) 100%);
}

/* ===== Header ===== */
.topbar {
  position: relative; z-index: 1;
  color: #fff;
  padding: 18px 20px 0;
  box-shadow: 0 16px 26px -18px rgba(0,0,0,.55);
}
.topbar-inner { position: relative; max-width: 1180px; margin: 0 auto; }
.topbar-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand-title {
  font-family: var(--font-display); font-weight: 400; letter-spacing: .01em;
  text-transform: uppercase; margin: 0; line-height: 1; color: #fff; white-space: nowrap;
  /* Fluid, not a JS-toggled class: this has to be correct on the very first paint on a
     real phone, before init() ever runs, or the un-shrinkable nowrap heading forces the
     mobile browser to pick an oversized layout viewport and the whole page renders zoomed out. */
  font-size: clamp(14px, 4.4vw, 34px);
}
.brand-sub { font-size: 13px; opacity: .92; margin: 6px 0 0; font-weight: 500; }
.brand-sub b { font-weight: 700; }

.view-toggle {
  display: inline-flex; background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px;
  border: 1px solid rgba(255,255,255,.28); flex-shrink: 0;
}
.view-toggle button {
  font-family: var(--font-body); font-size: 12.5px; font-weight: 700; letter-spacing: .02em;
  border: none; background: transparent; color: #fff; opacity: .75;
  padding: 7px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: background-color .15s ease, color .15s ease, opacity .15s ease;
}
.view-toggle button.active { background: var(--lime); color: #0d3a2b; opacity: 1; }

.tabs {
  max-width: 1180px; margin: 16px auto 0; display: flex; gap: 4px; overflow-x: auto;
  padding-bottom: 0; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  font-family: var(--font-ui); font-weight: 700; font-size: 16px; letter-spacing: .01em; text-transform: uppercase;
  background: none; border: none; color: rgba(255,255,255,.68); padding: 10px 16px 12px;
  cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; transition: color .15s ease, border-color .15s ease;
}
.tab-btn.active { color: var(--lime-text); border-bottom-color: var(--lime); }

/* ===== Filter bar (Category + Tier, shared across tabs) ===== */
.filter-bar { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; }
.filter-group { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.filter-label { font-family: var(--font-ui); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-right: 2px; }
.pill-btn {
  font-family: var(--font-body); font-weight: 700; font-size: 12.5px; letter-spacing: .01em;
  background: var(--panel); border: 1px solid var(--border); color: var(--text-secondary);
  padding: 6px 15px; border-radius: 999px; cursor: pointer; transition: all .15s ease;
}
.pill-btn.active[data-catf="All"], .pill-btn.active[data-tierf="All"] { background: var(--panel-3); border-color: var(--text-secondary); color: var(--text-primary); }
.pill-btn.active[data-catf="Male"] { background: var(--male-bg); border-color: var(--male-border); color: var(--male-text); }
.pill-btn.active[data-catf="Female"] { background: var(--female-bg); border-color: var(--female-border); color: var(--female-text); }
.pill-btn.active[data-tierf="Bronze"] { background: var(--bronze-bg); border-color: var(--bronze-border); color: var(--bronze); }
.pill-btn.active[data-tierf="Silver"] { background: var(--silver-bg); border-color: var(--silver-border); color: var(--silver); }
.pill-btn.active[data-tierf="Gold"] { background: var(--gold-bg); border-color: var(--gold-border); color: var(--gold); }

.court-filter-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
.pill-btn.active[data-courtf] { background: var(--panel-3); border-color: var(--text-secondary); color: var(--text-primary); }

/* Compact filters on narrow screens: drop the text labels, shrink the bubbles. */
@media (max-width: 640px) {
  .filter-bar { gap: 6px 10px; margin-bottom: 10px; }
  .filter-group { gap: 4px; }
  .filter-label { display: none; }
  .court-filter-row { gap: 4px; margin-bottom: 10px; }
  .pill-btn { padding: 4px 10px; font-size: 11px; }
}
/* Same compact treatment when "Mobile" is toggled manually on a wide desktop
   browser -- the real viewport is still wide there, so the media query above
   alone never fires; this class-based mirror covers that case. */
.view-mobile .filter-bar { gap: 6px 10px; margin-bottom: 10px; }
.view-mobile .filter-group { gap: 4px; }
.view-mobile .filter-label { display: none; }
.view-mobile .court-filter-row { gap: 4px; margin-bottom: 10px; }
.view-mobile .pill-btn { padding: 4px 10px; font-size: 11px; }

/* ===== Layout shell ===== */
.app-shell { position: relative; z-index: 1; max-width: 1180px; width: 100%; margin: 0 auto; padding: 20px 20px 60px; }
.view-mobile .app-shell { max-width: 430px; padding: 16px 14px 60px; }
.view-mobile .topbar-inner { max-width: 430px; }
.view-mobile .tabs { max-width: 430px; }
.panel { display: none; opacity: 0; }
.panel.active { display: block; animation: panelIn .22s ease forwards; }
@keyframes panelIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .panel.active { animation: none; opacity: 1; } }

.search-box {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
  font-family: var(--font-body); background: var(--panel); color: var(--text-primary); margin-bottom: 14px;
  /* iOS/Android auto-zoom the page on focus for any input under 16px, then often fail to
     zoom back out -- staying at/above 16px avoids the zoom entirely instead of chasing it. */
  font-size: 16px;
}
.search-box::placeholder { color: var(--text-muted); }
.search-box:focus { outline: 2px solid var(--lime); outline-offset: 1px; }

.data-note {
  font-size: 12px; color: var(--text-muted); background: var(--panel); border: 1px dashed var(--border);
  border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}
.data-note .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
.data-note.live .dot { background: var(--live); }
.data-note.live { color: var(--live); border-style: solid; border-color: var(--live-border); }
/* Just the ticking time value (countdown or live clock) gets the Tatler lime
   accent, same family as the Web/Mobile toggle -- the rest of the line stays
   in its normal muted/live color. */
#liveClock { color: var(--lime); font-weight: 800; }
/* On mobile the full date/time detail is dropped so the status badge always
   fits on one line -- "Starts in 2d 04:12:09" / "FINISHED" alone, no wrap. */
@media (max-width: 640px) {
  .data-note { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .data-note-detail { display: none; }
}
.view-mobile .data-note { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view-mobile .data-note-detail { display: none; }

/* ===== Groups tab ===== */
.groups-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 16px; }
.view-mobile .groups-grid { grid-template-columns: 1fr; }
.group-card {
  background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--bc, var(--border));
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.group-card-head {
  font-family: var(--font-ui); font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .02em;
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: color-mix(in srgb, var(--bc, var(--text-muted)) 22%, transparent);
  color: color-mix(in srgb, var(--bc, var(--text-primary)) 65%, white);
  border-bottom: 1px solid color-mix(in srgb, var(--bc, var(--border)) 45%, transparent);
}
.group-card-head .tier-tag { flex-shrink: 0; }

.notice-card .notice-body, .panel-note { padding: 18px 16px; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.notice-card .notice-body p { margin: 0 0 6px; }
.notice-card .notice-sub { color: var(--text-muted); font-size: 12px; }
.panel-note { background: var(--panel); border: 1px dashed var(--border); border-radius: 10px; }

table.standings { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.standings th {
  text-align: center; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: .02em; padding: 8px 4px 6px; border-bottom: 1px solid var(--border);
}
table.standings th.team-col, table.standings td.team-col { text-align: left; padding-left: 12px; }
table.standings td { text-align: center; padding: 8px 4px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
table.standings tr:last-child td { border-bottom: none; }
table.standings tr.clickable { cursor: pointer; transition: background-color .15s ease; }
table.standings tr.clickable:hover { background: var(--panel-3); }
table.standings td.team-col { font-weight: 600; }
table.standings tr.rank-1 td { background: rgba(255,255,255,.08); }
table.standings tr.rank-2 td { background: rgba(255,255,255,.045); }
table.standings tr.clickable.rank-1:hover td, table.standings tr.clickable.rank-2:hover td { background: var(--panel-3); }
/* Badge sits beside the (possibly two-line) name block, vertically centered,
   instead of the badge forcing its own line above the names with empty space
   next to it -- the badge is inline-flex, so without this it and the block-
   level name lines below it would each start their own line by default. */
.rank-team-cell { display: flex; align-items: center; }
.rank-team-names { min-width: 0; }
.rank-team-line { display: inline; }
.rank-team-line + .rank-team-line::before { content: ' / '; }
/* Rankings tab shows full names (can run long) as two separate lines instead of
   one flowing "P1 / P2" string, so a long name can't make just that row taller
   than its neighbours. On mobile each line is also ellipsis-truncated instead of
   wrapping, so every row keeps exactly the same height. Same dual (media query +
   .view-mobile class) coverage as the filter bar above. */
@media (max-width: 640px) {
  table.standings { table-layout: fixed; }
  table.standings th.team-col, table.standings td.team-col { width: 48%; padding-left: 6px; }
  table.standings th:not(.team-col), table.standings td:not(.team-col) { padding-left: 2px; padding-right: 2px; }
  .rank-team-line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.35; }
  .rank-team-line + .rank-team-line::before { content: none; }
}
.view-mobile table.standings { table-layout: fixed; }
.view-mobile table.standings th.team-col, .view-mobile table.standings td.team-col { width: 48%; padding-left: 6px; }
.view-mobile table.standings th:not(.team-col), .view-mobile table.standings td:not(.team-col) { padding-left: 2px; padding-right: 2px; }
.view-mobile .rank-team-line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.35; }
.view-mobile .rank-team-line + .rank-team-line::before { content: none; }

.rank-badge {
  display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px;
  border-radius: 5px; font-size: 10px; font-weight: 800; background: var(--panel-2); color: var(--text-muted); margin-right: 7px;
}
tr.rank-1 .rank-badge { background: var(--gold-bg); color: var(--gold); }

/* ===== All Matches / match cards ===== */
.day-section { margin-bottom: 26px; }
.day-title {
  font-family: var(--font-ui); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: 14px;
  color: var(--lime-text); margin: 0 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--border);
}
.match-list { display: flex; flex-direction: column; gap: 10px; }
.match-card {
  position: relative;
  background: color-mix(in srgb, var(--bc, transparent) 9%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--bc, var(--border)) 38%, var(--border));
  border-left: 4px solid var(--bc, var(--border));
  border-radius: 12px; padding: 12px 16px;
  box-shadow: var(--shadow); transition: box-shadow .15s ease, border-color .15s ease, background-color .15s ease, transform .12s ease;
  cursor: pointer;
}
.match-card:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -10px rgba(0,0,0,.55); }
.match-card.bye { cursor: default; }
.bye-scoreboard { display: flex; align-items: center; justify-content: space-between; }
.bye-note { font-size: 10.5px; color: var(--text-muted); font-style: italic; flex-shrink: 0; }
.status-pill.Bye { color: var(--text-secondary); }
.status-pill.Walkover { color: var(--walkover); }
.match-card.live { border-color: var(--live); border-left-color: var(--live); box-shadow: 0 0 0 1px var(--live), var(--shadow); }
.match-card.completed { filter: saturate(.55) brightness(.92); }
.match-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; padding-right: 60px; }
.view-mobile .match-card-top { gap: 6px; }
.match-num { font-family: var(--font-ui); font-size: 13px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
.match-time { font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; line-height: 1.25; }
.match-time b { color: var(--text-primary); font-size: 12.5px; margin-right: 4px; }
.match-court { font-size: 10.5px; color: var(--text-muted); flex-shrink: 0; }
.match-tag {
  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
  padding: 3px 7px; border-radius: 5px; flex-shrink: 0; white-space: nowrap;
  background: color-mix(in srgb, var(--bc, var(--panel-3)) 20%, var(--panel-3));
  color: color-mix(in srgb, var(--bc, var(--text-secondary)) 85%, white);
}
.tier-tag {
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
  padding: 2.5px 7px; border-radius: 5px; flex-shrink: 0; white-space: nowrap;
  background: color-mix(in srgb, var(--bc, var(--text-muted)) 20%, transparent);
  color: color-mix(in srgb, var(--bc, var(--text-secondary)) 85%, white);
  border: 1px solid color-mix(in srgb, var(--bc, var(--border)) 50%, transparent);
}
/* A plain small corner label instead of a filled pill -- keeps the top row
   (match #, category tag, time/court) free of a badge competing for width,
   which is what was forcing a wrap in narrow cells. Taken out of the flex
   flow entirely (position:absolute off .match-card) so its own text length
   can never trigger that wrap in the first place. */
.status-pill {
  position: absolute; top: 13px; right: 15px;
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
  white-space: nowrap; line-height: 1; pointer-events: none;
}
.status-pill.Scheduled { color: var(--text-muted); }
.status-pill.InProgress { color: var(--live); }
.status-pill.Completed { color: var(--live); }

.scoreboard { border-top: 1px solid var(--border); padding-top: 8px; }
.sb-row { display: flex; align-items: center; gap: 14px; padding: 5px 0; }
.sb-row.winner .sb-names span { font-weight: 800; color: #fff; }
.sb-row.winner .sb-set { color: #fff; }
.sb-names { flex: 0 1 auto; min-width: 0; max-width: 62%; display: flex; flex-direction: column; gap: 1px; }
.sb-names span { font-size: 14px; font-weight: 500; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-sets { display: flex; gap: 10px; flex-shrink: 0; margin-left: auto; }
.sb-set { font-family: var(--font-display); font-weight: 400; font-size: 22px; min-width: 20px; text-align: center; color: var(--text-secondary); white-space: nowrap; }
.sb-set .sb-tb { font-size: 10px; font-weight: 700; color: var(--text-muted); font-family: var(--font-body); margin-left: 1px; }
.sb-set.sb-stb { display: inline-flex; align-items: baseline; gap: 2px; color: var(--lime-text); }
.sb-set.sb-stb small { font-family: var(--font-ui); font-size: 8px; font-weight: 800; letter-spacing: .02em; color: var(--text-muted); align-self: center; }
.view-mobile .sb-names span { font-size: 13px; }
.view-mobile .sb-set { font-size: 19px; }

/* ===== Playoff bracket ===== */
.playoff-bucket { margin-bottom: 30px; }
.playoff-bucket-title {
  font-family: var(--font-ui); font-size: 18px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .02em; margin: 0 0 12px; padding: 8px 14px; border-radius: 8px;
  background: color-mix(in srgb, var(--bc, var(--text-muted)) 18%, transparent);
  color: color-mix(in srgb, var(--bc, var(--text-primary)) 65%, white);
  border: 1px solid color-mix(in srgb, var(--bc, var(--border)) 45%, transparent);
}
.bracket-columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.view-mobile .bracket-columns { grid-template-columns: 1fr; }
.bracket-col-title {
  font-family: var(--font-ui); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
  color: var(--lime-text); margin-bottom: 10px;
}
.bracket-col-title.consolation { color: var(--text-muted); }
.bracket-round { margin-bottom: 18px; }
.bracket-round-title {
  font-family: var(--font-ui); font-size: 13px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .03em; color: var(--text-secondary); margin: 0 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border);
}
.bracket-cards { display: flex; flex-direction: column; gap: 10px; }

/* ===== Team detail / match detail side panels ===== */
.side-overlay { position: fixed; inset: 0; background: rgba(4,18,13,.62); z-index: 50; display: none; }
.side-overlay.open { display: block; }
.side-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 92vw; background: var(--bg-1);
  z-index: 51; box-shadow: -10px 0 34px rgba(0,0,0,.45); transform: translateX(100%); transition: transform .24s cubic-bezier(.2,.8,.2,1);
  overflow-y: auto; border-left: 1px solid var(--border);
}
.side-panel.open { transform: translateX(0); }
#matchDrawerOverlay { z-index: 60; }
#matchDrawer { z-index: 61; }
/* On mobile, slide up from the bottom as a centered sheet instead of the
   right-side drawer -- feels native on a phone and keeps the panel reachable
   with a thumb. Same dual (media query + .view-mobile class) coverage as the
   filter bar above. */
@media (max-width: 640px) {
  .side-panel {
    left: 0; right: 0; top: auto; bottom: 0; width: 100%; max-width: 100%;
    max-height: 86vh; border-radius: 18px 18px 0 0; border-left: none; border-top: 1px solid var(--border);
    transform: translateY(100%);
  }
  .side-panel.open { transform: translateY(0); }
  .side-head::before {
    content: ""; display: block; width: 36px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.32); margin: 0 auto 10px;
  }
}
.view-mobile .side-panel {
  left: 0; right: 0; top: auto; bottom: 0; width: 100%; max-width: 100%;
  max-height: 86vh; border-radius: 18px 18px 0 0; border-left: none; border-top: 1px solid var(--border);
  transform: translateY(100%);
}
.view-mobile .side-panel.open { transform: translateY(0); }
.view-mobile .side-head::before {
  content: ""; display: block; width: 36px; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,.32); margin: 0 auto 10px;

.side-head {

}
.side-head h3 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0 0 2px; text-transform: uppercase; }
.side-head p { margin: 0; font-size: 12.5px; opacity: .9; }
.side-close {

.side-body { padding: 16px 18px; }

/* Match detail specifics inside the side panel */
.md-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.md-num { font-family: var(--font-ui); font-size: 14px; font-weight: 800; }
.mm-photo-row { display: flex; justify-content: space-around; padding: 6px 8px 0; }
.mm-scoreboard { padding: 12px 4px 0; border-top: none; }
.mm-scoreboard .sb-names span { font-size: 15px; }
.mm-photo-placeholder {
  width: 56px; height: 56px; border-radius: 50%; background: var(--panel-3); border: 1px dashed var(--border);
  margin: 0 auto 8px;
}
.mm-team-name { font-size: 13px; line-height: 1.3; color: var(--text-secondary); text-align: center; }
.mm-team-name span { display: block; white-space: normal; overflow-wrap: break-word; }
.mm-bye { text-align: center; }
.mm-bye-label { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 4px; }

.mm-field-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 3px; }
.mm-field-placeholder { font-size: 12px; color: var(--text-secondary); background: var(--panel); border: 1px dashed var(--border); border-radius: 8px; padding: 8px 10px; text-align: center; }

.ranking-table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }

// ---------------------------------------------------------------------
// CSV parsing (RFC4180-ish, handles quoted commas/newlines)
// ---------------------------------------------------------------------
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function extractDataRows(rows, headerMarker, idPattern) {
  const idx = rows.findIndex(r => (r[0] || '').toString().trim() === headerMarker);
  const body = idx === -1 ? rows : rows.slice(idx + 1);
  return body.filter(r => {
    const first = (r[0] || '').toString().trim();
    if (!(r.length > 1 && first)) return false;
    if (idPattern && !idPattern.test(first)) return false;
    return true;
  });
}

function num(v) {
  if (v === undefined || v === null || v === '') return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
function str(v) { return v === undefined || v === null ? '' : String(v); }

// ---------------------------------------------------------------------

function rowToGroupTeam(r) {
  return { category: str(r[0]), tier: str(r[1]), group: str(r[2]), team: str(r[3]), player1: str(r[4]), player2: str(r[5]) };
}
function rowToMatch(r) {
  return {
    id: str(r[0]), num: num(r[1]), start: str(r[2]), end: str(r[3]), court: str(r[4]), date: str(r[5]),
    category: str(r[6]), tier: str(r[7]), group: str(r[8]), team1: str(r[9]), team2: str(r[10]),
    s1: [num(r[11]), num(r[12])], tb1: [num(r[13]), num(r[14])],
    s2: [num(r[15]), num(r[16])], tb2: [num(r[17]), num(r[18])],
    s3: [num(r[19]), num(r[20])], stb: [num(r[21]), num(r[22])],
    status: str(r[23] || 'Scheduled').trim(), winner: str(r[24]).trim(),
  };
}
function rowToPlayoff(r) {
  return {
    id: str(r[0]), num: num(r[1]), start: str(r[2]), end: str(r[3]), court: str(r[4]), date: str(r[5]),
    category: str(r[6]), tier: str(r[7]), bracket: str(r[8]), round: str(r[9]), team1: str(r[10]), team2: str(r[11]),
    s1: [num(r[12]), num(r[13])], tb1: [num(r[14]), num(r[15])],
    s2: [num(r[16]), num(r[17])], tb2: [num(r[18]), num(r[19])],
    s3: [num(r[20]), num(r[21])], stb: [num(r[22]), num(r[23])],
    status: str(r[24] || 'Scheduled').trim(), winner: str(r[25]).trim(),
  };
}

function timeSort(a, b) {
  return (a.date || '').localeCompare(b.date || '') || (a.start || '').localeCompare(b.start || '') || (a.court || 0) - (b.court || 0);
}

const APP = { groups: [], matches: [], playoff: [], usingLive: false };
const FILTERS = { category: 'All', tier: 'All', court: 'All' };
let PLAYOFF_VIEW = 'bracket'; // 'bracket' | 'chrono'
const CATEGORY_ORDER = ['Male', 'Female'];
const TIER_ORDER = ['Bronze', 'Silver', 'Gold'];

// One distinct accent color per Category+Tier bucket, so e.g. "Male Silver" is
// recognizable by color alone. Male stays in a true blue family (kept clearly
// apart from the green backdrop), Female in a warm rose/amber family;
// brightness/saturation rises Bronze -> Silver -> Gold in both.
const BUCKET_COLORS = {
  Male:   { Bronze: '#5c82a6', Silver: '#4fa8e0', Gold: '#3fd4e8' },
  Female: { Bronze: '#c98a72', Silver: '#d9a8c9', Gold: '#e85c8a' },
};
function bucketColor(category, tier) {
  return (BUCKET_COLORS[category] && BUCKET_COLORS[category][tier]) || '#7fa08c';
}
function bucketStyleAttr(category, tier) {
  return `--bc:${bucketColor(category, tier)}`;
}

// "Zack Boon" -> "Zack" — used everywhere except the Rankings tab, which
// shows full names. First-name-only keeps match cards readable on mobile.
function firstNameOnly(n) {
  const parts = (n || '').trim().split(/\s+/);
  return parts[0] || n || '';
}

function allEntries() { return APP.matches.concat(APP.playoff); }

async function fetchCsvRows(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('fetch failed');
  const text = await res.text();
  return parseCSV(text);
}

async function loadData() {
  let groupsRows, matchesRows, playoffRows, live = false;
  try {
    if (CONFIG.groupsCsvUrl && CONFIG.matchesCsvUrl && CONFIG.playoffCsvUrl) {
      [groupsRows, matchesRows, playoffRows] = await Promise.all([
        fetchCsvRows(CONFIG.groupsCsvUrl),
        fetchCsvRows(CONFIG.matchesCsvUrl),
        fetchCsvRows(CONFIG.playoffCsvUrl),
      ]);
      live = true;
    } else {
      throw new Error('no config urls');
    }
  } catch (e) {
    groupsRows = SEED.groups; matchesRows = SEED.matches; playoffRows = SEED.playoff;
    live = false;
  }

  APP.groups = extractDataRows(groupsRows, 'Category', /^(Male|Female)$/i).map(rowToGroupTeam);
  APP.matches = extractDataRows(matchesRows, 'Match ID', /^[A-Za-z]\d+$/).map(rowToMatch).sort(timeSort);
  APP.playoff = extractDataRows(playoffRows, 'Match ID', /^[A-Za-z]\d+$/).map(rowToPlayoff).sort(timeSort);
  APP.usingLive = live;
}

// ---------------------------------------------------------------------
// Standings
// ---------------------------------------------------------------------
function gamesFor(m, side) {
  let g = 0;
  [m.s1, m.s2, m.s3].forEach(s => { if (s[side] != null) g += s[side]; });
  return g;
}
function tbPointsFor(m, side) {
  let t = 0;
  [m.tb1, m.tb2, m.stb].forEach(tb => { if (tb[side] != null) t += tb[side]; });
  return t;
}

function computeStandings(teamRows, matchList) {
  const stats = {};
  teamRows.forEach(t => {
    stats[t.team] = { team: t.team, group: t.group, player1: t.player1, player2: t.player2,
      w: 0, l: 0, gf: 0, ga: 0, tbf: 0, tba: 0 };
  });
  matchList.forEach(m => {
    if (!(m.status === 'Completed' || m.status === 'Walkover') || !m.winner) return;
    const t1 = stats[m.team1], t2 = stats[m.team2];
    if (!t1 || !t2) return;
    const g1 = gamesFor(m, 0), g2 = gamesFor(m, 1);
    const tb1 = tbPointsFor(m, 0), tb2 = tbPointsFor(m, 1);
    t1.gf += g1; t1.ga += g2; t1.tbf += tb1; t1.tba += tb2;
    t2.gf += g2; t2.ga += g1; t2.tbf += tb2; t2.tba += tb1;
    if (m.winner === m.team1) { t1.w++; t2.l++; } else if (m.winner === m.team2) { t2.w++; t1.l++; }
  });
  const arr = Object.values(stats);
  arr.sort((a, b) =>
    (b.w - a.w) ||
    ((b.gf - b.ga) - (a.gf - a.ga)) ||
    (b.gf - a.gf) ||
    ((b.tbf - b.tba) - (a.tbf - a.tba)) ||
    (b.tbf - a.tbf)
  );
  return arr;
}

function matchCategory(m) { return m.category; }
function matchTier(m) { return m.tier; }
function matchLabel(m) {
  if (m.round) return `${m.tier} · ${m.bracket === 'Consolation' ? 'Cons. ' : ''}${m.round}`;
  return `${m.tier} ${m.group}`;
}
function esc(s) { return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function isByeMatch(m) { return m.team1 === 'BYE' || m.team2 === 'BYE'; }
function isWalkoverMatch(m) { return (m.status || '') === 'Walkover'; }

// ---------------------------------------------------------------------
// Score formatting (tennis-style, with tiebreak & super-tiebreak support)
// ---------------------------------------------------------------------
function getSets(m) {
  // Set1/Set2 can each end 7-6 with the tiebreak score recorded in TB1/TB2.
  // The 3rd slot is either a full Set3 (finals-style, no dedicated tiebreak column)
  // OR a standalone Super Tiebreak (S-TB) that REPLACES a 3rd set entirely --
  // these two are mutually exclusive, never paired together.
  const sets = [];
  if (m.s1[0] != null || m.s1[1] != null) sets.push({ set: m.s1, tb: m.tb1, kind: 'set' });
  if (m.s2[0] != null || m.s2[1] != null) sets.push({ set: m.s2, tb: m.tb2, kind: 'set' });
  if (m.s3[0] != null || m.s3[1] != null) sets.push({ set: m.s3, tb: [null, null], kind: 'set' });
  else if (m.stb[0] != null || m.stb[1] != null) sets.push({ set: m.stb, tb: [null, null], kind: 'stb' });
  return sets;
}
function sbSetHtml(val, tbVal, isStb) {
  const v = val != null ? val : '-';
  if (isStb) return `<span class="sb-set sb-stb"><small>STB</small>${v}</span>`;
  return `<span class="sb-set">${v}${tbVal != null ? `<sup class="sb-tb">${tbVal}</sup>` : ''}</span>`;
}
function scoreboardSetsHtml(m) {
  const sets = getSets(m);
  if (!sets.length) return { a: '', b: '', played: false };
  const a = [], b = [];
  sets.forEach(({ set: s, tb, kind }) => {
    if (kind === 'stb') {
      a.push(sbSetHtml(s[0], null, true));
      b.push(sbSetHtml(s[1], null, true));
      return;
    }
    // Show both sides' tiebreak points (e.g. 7-6(7) 6-7(0)), not just the loser's.
    a.push(sbSetHtml(s[0], tb[0], false));
    b.push(sbSetHtml(s[1], tb[1], false));
  });
  return { a: a.join(''), b: b.join(''), played: true };
}

function teamNameLines(teamStr) {
  const parts = (teamStr || '').split('/');
  if (parts.length === 2) return `<span>${esc(firstNameOnly(parts[0].trim()))}</span><span>${esc(firstNameOnly(parts[1].trim()))}</span>`;
  return `<span>${esc(firstNameOnly(teamStr))}</span>`;
}
function teamColHtml(s, full) {
  if (full) return `${esc(s.player1)} / ${esc(s.player2)}`;
  return `${esc(firstNameOnly(s.player1))} / ${esc(firstNameOnly(s.player2))}`;
}
// Rankings tab shows full names, which can be long -- rendered as two separate
// lines (rather than one wrapping string) so every row keeps the same height,
// with each line ellipsis-truncated on mobile instead of wrapping unpredictably.
function teamColLinesHtml(s) {
  return `<span class="rank-team-line">${esc(s.player1)}</span><span class="rank-team-line">${esc(s.player2)}</span>`;
}

// ---------------------------------------------------------------------
// Match card renderers (shared by All Matches, Playoff, Team drawer, grid)
// ---------------------------------------------------------------------
function matchRowHtml(m, compact) {
  const cat = matchCategory(m);
  const tier = matchTier(m);
  const statusClass = (m.status || '').replace(/\s+/g, '');
  const isLive = m.status === 'In Progress';
  const isDone = m.status === 'Completed';
  const isBye = isByeMatch(m);
  const compactCls = compact ? 'compact' : '';
  const timeCourtHtml = compact ? '' : `
        <span class="match-time"><b>${esc(m.start)}</b>${esc(m.end)}</span>
        <span class="match-court">Court ${esc(m.court)}</span>`;
  const matchTagHtml = `<span class="match-tag ${cat}">${esc(matchLabel(m))}</span>`;

  const bc = bucketStyleAttr(cat, tier);

  if (isBye) {
    const advancing = m.team1 === 'BYE' ? m.team2 : m.team1;
    return `
    <div class="match-card ${compactCls} ${cat} bye" data-num="${m.num}" style="${bc}">
      <div class="match-card-top">
        <span class="match-num">#${m.num}</span>${timeCourtHtml}
        ${matchTagHtml}
        <span class="status-pill Bye">Bye</span>
      </div>
      <div class="scoreboard bye-scoreboard">
        <div class="sb-row winner">
          <div class="sb-names">${teamNameLines(advancing)}</div>
          <div class="bye-note">advances (bye)</div>
        </div>
      </div>
    </div>`;
  }

  if (isWalkoverMatch(m)) {
    const winnerTeam = m.winner || m.team1;
    const loserTeam = winnerTeam === m.team1 ? m.team2 : m.team1;
    return `
    <div class="match-card ${compactCls} ${cat}" data-num="${m.num}" style="${bc}">
      <div class="match-card-top">
        <span class="match-num">#${m.num}</span>${timeCourtHtml}
        ${matchTagHtml}
        <span class="status-pill Walkover">WO</span>
      </div>
      <div class="scoreboard">
        <div class="sb-row winner">
          <div class="sb-names">${teamNameLines(winnerTeam)}</div>
          <div class="sb-sets"><span class="sb-set">WO</span></div>
        </div>
        <div class="sb-row">
          <div class="sb-names">${teamNameLines(loserTeam)}</div>
        </div>
      </div>
    </div>`;
  }

  const score = scoreboardSetsHtml(m);
  const w1 = isDone && m.winner === m.team1;
  const w2 = isDone && m.winner === m.team2;
  // Used to be suppressed for compact/grid cards to save space when the old
  // status-pill was a wide filled bubble; now that it's a small corner label
  // (see .status-pill), there's no reason to hide "Completed" there anymore.
  const statusLabel = isLive ? 'On Court' : m.status;
  return `
    <div class="match-card ${compactCls} ${cat} ${isLive?'live':''} ${isDone?'completed':''}" data-num="${m.num}" style="${bc}">
      <div class="match-card-top">
        <span class="match-num">#${m.num}</span>${timeCourtHtml}
        ${matchTagHtml}
        ${statusLabel ? `<span class="status-pill ${statusClass}">${esc(statusLabel)}</span>` : ''}
      </div>
      <div class="scoreboard">
        <div class="sb-row ${w1?'winner':''}">
          <div class="sb-names">${teamNameLines(m.team1)}</div>
          ${score.played ? `<div class="sb-sets">${score.a}</div>` : ''}
        </div>
        <div class="sb-row ${w2?'winner':''}">
          <div class="sb-names">${teamNameLines(m.team2)}</div>
          ${score.played ? `<div class="sb-sets">${score.b}</div>` : ''}
        </div>
      </div>
    </div>`;
}
function matchCardCompactHtml(m) { return matchRowHtml(m, true); }

// ---------------------------------------------------------------------

let clockInterval = null;
function bangkokTimeString() {
  return new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour12: false });
}

// Tournament window, in Bangkok time (UTC+7, no DST -- safe to hardcode the offset).
// Match #1: Saturday 22 Aug 2026, 08:00. Last possible match window: Sunday 23 Aug 2026, 23:59.
const TOURNEY_START = new Date('2026-08-22T08:00:00+07:00');
const TOURNEY_END = new Date('2026-08-23T23:59:59+07:00');
function formatCountdown(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return (days > 0 ? days + 'd ' : '') + pad(hours) + ':' + pad(mins) + ':' + pad(secs);
}

function dayLabel(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}

function matchesGridHtml(rows) {
  const cols = Array.from(new Set(rows.map(m => String(m.court)))).sort((a,b)=>a-b);
  const byTime = {};
  rows.forEach(m => { (byTime[m.start] = byTime[m.start] || []).push(m); });
  const times = Object.keys(byTime).sort();
  let html = `<div class="matches-grid"><div class="mg-row mg-head" style="grid-template-columns:68px repeat(${cols.length},minmax(0,1fr))"><div class="mg-time"></div>` +
    cols.map(c => `<div class="mg-col-label">Court ${esc(c)}</div>`).join('') + '</div>';
  times.forEach(t => {
    const matchesAtT = byTime[t];
    const end = matchesAtT[0].end;
    html += `<div class="mg-row" style="grid-template-columns:68px repeat(${cols.length},minmax(0,1fr))"><div class="mg-time"><b>${esc(t)}</b>${esc(end)}</div>`;
    cols.forEach(c => {
      const m = matchesAtT.find(x => String(x.court) === String(c));
      html += `<div class="mg-cell">${m ? matchCardCompactHtml(m) : ''}</div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderDataNote() {
  const el = document.getElementById('dataNote');
  if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
  if (!APP.usingLive) {
    el.className = 'data-note';
    el.innerHTML = '<span class="dot"></span> Showing demo data — connect your Google Sheet links in CONFIG (top of the script) to go live.';
    return;
  }
  const now = new Date();
  if (now < TOURNEY_START) {
    el.className = 'data-note';
    el.innerHTML = '<span class="dot"></span> Starts in <b id="liveClock">' + formatCountdown(TOURNEY_START - now) +
      '</b><span class="data-note-detail"> &middot; Sat 22 Aug 2026, 08:00 (Bangkok)</span>';
    clockInterval = setInterval(() => {
      const now2 = new Date();
      if (now2 >= TOURNEY_START) { renderDataNote(); return; }
      const clockEl = document.getElementById('liveClock');
      if (clockEl) clockEl.textContent = formatCountdown(TOURNEY_START - now2);
    }, 1000);
  } else if (now <= TOURNEY_END) {
    el.className = 'data-note live';
    el.innerHTML = '<span class="dot"></span> <b>LIVE</b> <span id="liveClock">' + bangkokTimeString() + '</span>';
    clockInterval = setInterval(() => {
      const now2 = new Date();
      if (now2 > TOURNEY_END) { renderDataNote(); return; }
      const clockEl = document.getElementById('liveClock');
      if (clockEl) clockEl.textContent = bangkokTimeString();
    }, 1000);
  } else {
    el.className = 'data-note';
    el.innerHTML = '<span class="dot"></span> <b>FINISHED</b><span class="data-note-detail"> &middot; 23 Aug 2026, 23:59 (Bangkok)</span>';
  }
}

function groupBuckets() {
  const seen = new Map();
  APP.groups.forEach(t => {
    const key = `${t.category}|${t.tier}|${t.group}`;
    if (!seen.has(key)) seen.set(key, { category: t.category, tier: t.tier, group: t.group, teams: [] });
    seen.get(key).teams.push(t);
  });
  return Array.from(seen.values()).sort((a, b) =>
    CATEGORY_ORDER.indexOf(a.category) - CATEGORY_ORDER.indexOf(b.category) ||
    TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier) ||
    (a.group || '').localeCompare(b.group || ''));
}

function tierBuckets() {
  const seen = new Map();
  APP.groups.forEach(t => {
    const key = `${t.category}|${t.tier}`;
    if (!seen.has(key)) seen.set(key, { category: t.category, tier: t.tier, teams: [], hasGroups: false });
    const b = seen.get(key);
    b.teams.push(t);
    if (t.group) b.hasGroups = true;
  });
  return Array.from(seen.values()).sort((a, b) =>
    CATEGORY_ORDER.indexOf(a.category) - CATEGORY_ORDER.indexOf(b.category) ||
    TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier));
}

function passesFilters(category, tier) {
  return (FILTERS.category === 'All' || category === FILTERS.category) &&
         (FILTERS.tier === 'All' || tier === FILTERS.tier);
}

function renderGroups(filterText) {
  const wrap = document.getElementById('groupsGrid');
  wrap.innerHTML = '';
  const f = (filterText || '').trim().toLowerCase();
  groupBuckets().forEach(b => {
    if (!passesFilters(b.category, b.tier)) return;
    if (b.group === '') {
      if (f) return; // hide info cards while a player search is active
      const card = document.createElement('div');
      card.className = 'group-card notice-card';
      card.style.setProperty('--bc', bucketColor(b.category, b.tier));
      card.innerHTML = `
        <div class="group-card-head ${b.category}"><span>${esc(b.category)} ${esc(b.tier)}</span><span class="tier-tag ${esc(b.tier)}">${esc(b.tier)}</span></div>
        <div class="notice-body">
          <p>No group stage &mdash; this category goes straight to <b>Semifinals</b>.</p>
          <p class="notice-sub">See the <b>Playoff</b> tab for the bracket.</p>
        </div>`;
      wrap.appendChild(card);
      return;
    }
    const groupMatches = APP.matches.filter(m => m.category === b.category && m.tier === b.tier && m.group === b.group);
    const standings = computeStandings(b.teams, groupMatches);
    const filtered = f ? standings.filter(s =>
      (s.player1 || '').toLowerCase().includes(f) || (s.player2 || '').toLowerCase().includes(f)) : standings;
    if (f && !filtered.length) return;
    const card = document.createElement('div');
    card.className = 'group-card';
    card.style.setProperty('--bc', bucketColor(b.category, b.tier));
    const fullBoard = filtered.length === standings.length;
    card.innerHTML = `
      <div class="group-card-head ${b.category}"><span>${esc(b.category)} ${esc(b.tier)} ${esc(b.group)}</span><span class="tier-tag ${esc(b.tier)}">${esc(b.tier)}</span></div>
      <table class="standings">
        <tr><th class="team-col">Team</th><th>W</th><th>L</th><th>Games</th><th>GD</th><th>TB pts</th></tr>
        ${filtered.map((s, i) => `
          <tr class="clickable ${fullBoard && i===0 ? 'rank-1' : ''} ${fullBoard && i===1 ? 'rank-2' : ''}" data-team="${esc(s.team)}">
            <td class="team-col"><span class="rank-badge">${i+1}</span>${teamColHtml(s, false)}</td>
            <td>${s.w}</td><td>${s.l}</td><td>${s.gf}-${s.ga}</td><td>${s.gf-s.ga>0?'+':''}${s.gf-s.ga}</td><td>${s.tbf}-${s.tba}</td>
          </tr>`).join('')}
      </table>`;
    wrap.appendChild(card);
    card.querySelectorAll('tr.clickable').forEach(tr => {
      tr.addEventListener('click', () => openTeamDrawer(tr.getAttribute('data-team')));
    });
  });
  if (!wrap.children.length) {
    wrap.innerHTML = '<div class="empty-state">No groups match your filters.</div>';
  }
}

function matchMatchesSearch(m, f) {
  if (!f) return true;
  const numStr = String(m.num);
  if (f.replace('#','') === numStr) return true;
  return (m.team1||'').toLowerCase().includes(f) || (m.team2||'').toLowerCase().includes(f) ||
    (m.group||'').toLowerCase().includes(f) || (matchLabel(m)||'').toLowerCase().includes(f);
}

function renderCourtFilter() {
  const wrap = document.getElementById('courtFilter');
  const courts = Array.from(new Set(allEntries().map(m => String(m.court)))).sort((a,b)=>a-b);
  if (FILTERS.court !== 'All' && !courts.includes(FILTERS.court)) FILTERS.court = 'All';
  wrap.innerHTML = '<span class="filter-label">Court</span>' +
    `<button class="pill-btn ${FILTERS.court==='All'?'active':''}" data-courtf="All">All</button>` +
    courts.map(c => `<button class="pill-btn ${FILTERS.court===c?'active':''}" data-courtf="${esc(c)}">Court ${esc(c)}</button>`).join('');
  wrap.querySelectorAll('.pill-btn').forEach(b => b.addEventListener('click', () => {
    FILTERS.court = b.dataset.courtf;
    renderCourtFilter();
    renderAllMatches(document.getElementById('matchSearch').value);
  }));
}

function renderAllMatches(filterText) {
  const wrap = document.getElementById('allMatchesList');
  const f = (filterText || '').trim().toLowerCase();
  const rows = allEntries().filter(m => {
    if (!passesFilters(matchCategory(m), matchTier(m))) return false;
    if (FILTERS.court !== 'All' && String(m.court) !== FILTERS.court) return false;
    return matchMatchesSearch(m, f);
  });
  if (!rows.length) { wrap.innerHTML = '<div class="empty-state">No matches found.</div>'; return; }
  const isMobile = document.body.classList.contains('view-mobile');
  const byDate = {};
  rows.forEach(m => { (byDate[m.date] = byDate[m.date] || []).push(m); });
  const dates = Object.keys(byDate).sort();
  wrap.innerHTML = dates.map(d => {
    const dayRows = byDate[d].slice().sort(timeSort);
    const body = isMobile
      ? `<div class="match-list">${dayRows.map(m => matchRowHtml(m)).join('')}</div>`
      : matchesGridHtml(dayRows);
    return `<div class="day-section"><div class="day-title">${esc(dayLabel(d))}</div>${body}</div>`;
  }).join('');
}

const BRACKET_ROUND_ORDER = ['Semifinal', 'Final'];

function playoffBuckets() {
  const seen = new Map();
  APP.playoff.forEach(m => {
    const key = `${m.category}|${m.tier}`;
    if (!seen.has(key)) seen.set(key, { category: m.category, tier: m.tier, rows: [] });
    seen.get(key).rows.push(m);
  });
  return Array.from(seen.values()).sort((a, b) =>
    CATEGORY_ORDER.indexOf(a.category) - CATEGORY_ORDER.indexOf(b.category) ||
    TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier));
}

function bracketColumnHtml(rows, bracketName) {
  const rs = rows.filter(m => m.bracket === bracketName);
  if (!rs.length) return '';
  const displayLabel = bracketName === 'Championship' ? 'Main Draw' : bracketName;
  let html = `<div class="bracket-col"><div class="bracket-col-title ${bracketName==='Consolation'?'consolation':''}">${esc(displayLabel)}</div>`;
  BRACKET_ROUND_ORDER.forEach(round => {
    const rr = rs.filter(m => m.round === round).sort((a,b)=>a.num-b.num);
    if (!rr.length) return;
    html += `<div class="bracket-round"><div class="bracket-round-title">${esc(round)}</div><div class="bracket-cards">${rr.map(m=>matchRowHtml(m)).join('')}</div></div>`;
  });
  html += '</div>';
  return html;
}

function playoffChronoHtml(buckets) {
  const rows = buckets.flatMap(b => b.rows);
  const byDate = {};
  rows.forEach(m => { (byDate[m.date] = byDate[m.date] || []).push(m); });
  const dates = Object.keys(byDate).sort();
  return dates.map(d => {
    const dayRows = byDate[d].slice().sort(timeSort);
    return `<div class="day-section"><div class="day-title">${esc(dayLabel(d))}</div><div class="match-list">${dayRows.map(m => matchRowHtml(m)).join('')}</div></div>`;
  }).join('');
}

function renderPlayoff() {
  const wrap = document.getElementById('playoffContent');
  const buckets = playoffBuckets().filter(b => passesFilters(b.category, b.tier));
  if (!buckets.length) { wrap.innerHTML = '<div class="empty-state">No playoff matches for this selection.</div>'; return; }
  if (PLAYOFF_VIEW === 'chrono') {
    wrap.innerHTML = playoffChronoHtml(buckets);
    return;
  }
  wrap.innerHTML = buckets.map(b => `
    <div class="playoff-bucket" style="${bucketStyleAttr(b.category, b.tier)}">
      <div class="playoff-bucket-title ${b.category}">${esc(b.category)} &middot; ${esc(b.tier)}</div>
      <div class="bracket-columns">
        ${bracketColumnHtml(b.rows, 'Championship')}
        ${bracketColumnHtml(b.rows, 'Consolation')}
      </div>
    </div>`).join('');
}

function renderRankings(filterText) {
  const wrap = document.getElementById('dayRankingList');
  const f = (filterText || '').trim().toLowerCase();
  const buckets = tierBuckets().filter(b => passesFilters(b.category, b.tier));
  if (!buckets.length) { wrap.innerHTML = '<div class="empty-state">No standings for this selection.</div>'; return; }
  const sections = buckets.map(b => {
    if (!b.hasGroups) {
      if (f) return ''; // hide the "no group stage" notice while a player search is active
      return `
      <div class="ranking-section" style="${bucketStyleAttr(b.category, b.tier)}">
        <div class="ranking-section-title ${b.category}">${esc(b.category)} &middot; ${esc(b.tier)}</div>
        <div class="panel-note">No group stage for this category &mdash; teams go straight to the Playoff bracket.</div>
      </div>`;
    }
    const matchRows = APP.matches.filter(m => m.category === b.category && m.tier === b.tier);
    const standings = computeStandings(b.teams, matchRows);
    const filtered = f ? standings.filter(s =>
      (s.player1 || '').toLowerCase().includes(f) || (s.player2 || '').toLowerCase().includes(f)) : standings;
    if (f && !filtered.length) return '';
    const fullBoard = filtered.length === standings.length;
    return `
      <div class="ranking-section" style="${bucketStyleAttr(b.category, b.tier)}">
        <div class="ranking-section-title ${b.category}">${esc(b.category)} &middot; ${esc(b.tier)}</div>
        <div class="ranking-table-wrap">
          <table class="standings" data-cat="${b.category}">
            <tr><th class="team-col">Team</th><th>Grp</th><th>W</th><th>L</th><th>Games</th><th>GD</th><th>TB pts</th></tr>
            ${filtered.map((s,i) => `
              <tr class="clickable ${fullBoard && i===0?'rank-1':''}" data-team="${esc(s.team)}">
                <td class="team-col"><div class="rank-team-cell"><span class="rank-badge">${i+1}</span><span class="rank-team-names">${teamColLinesHtml(s)}</span></div></td>
                <td>${esc(s.group)}</td><td>${s.w}</td><td>${s.l}</td><td>${s.gf}-${s.ga}</td><td>${s.gf-s.ga>0?'+':''}${s.gf-s.ga}</td><td>${s.tbf}-${s.tba}</td>
              </tr>`).join('')}
          </table>
        </div>
      </div>`;
  }).join('');
  wrap.innerHTML = sections || '<div class="empty-state">No players match your search.</div>';
  wrap.querySelectorAll('tr.clickable').forEach(tr => {
    tr.addEventListener('click', () => openTeamDrawer(tr.getAttribute('data-team')));
  });
}

function openTeamDrawer(teamName) {
  const info = APP.groups.find(t => t.team === teamName);
  const allM = APP.matches.filter(m => m.team1 === teamName || m.team2 === teamName).sort(timeSort);
  const allP = APP.playoff.filter(m => m.team1 === teamName || m.team2 === teamName).sort(timeSort);
  document.getElementById('drawerTitle').textContent = info ? `${firstNameOnly(info.player1)} / ${firstNameOnly(info.player2)}` : teamName;
  document.getElementById('drawerSub').textContent = info ? `${info.category} ${info.tier}${info.group ? ' ' + info.group : ''}` : '';
  const body = document.getElementById('drawerBody');
  const sections = [];
  if (allM.length) sections.push(`<h4>Group matches</h4><div class="match-list">${allM.map(m=>matchRowHtml(m)).join('')}</div>`);
  if (allP.length) sections.push(`<h4>Playoff</h4><div class="match-list">${allP.map(m=>matchRowHtml(m)).join('')}</div>`);
  body.innerHTML = sections.join('') || '<div class="empty-state">No matches found for this team.</div>';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

// ---------------------------------------------------------------------
// Match detail — right-side sliding panel (overlays on top, same
// mechanism as the team drawer, instead of the old centered popup)
// ---------------------------------------------------------------------
function openMatchDrawer(numValue) {
  const m = allEntries().find(x => String(x.num) === String(numValue));
  if (!m) return;
  const isBye = isByeMatch(m);
  const isDone = m.status === 'Completed';
  const score = isBye ? { a: '', b: '', played: false } : scoreboardSetsHtml(m);
  const w1 = isDone && m.winner === m.team1;
  const w2 = isDone && m.winner === m.team2;

  document.getElementById('mdMatchTitle').textContent = matchLabel(m);
  document.getElementById('mdNum').textContent = '#' + m.num;
  document.getElementById('mdTime').textContent = `${dayLabel(m.date)} · ${m.start}–${m.end} · Court ${m.court}`;
  document.getElementById('mdStatus').textContent = m.status === 'In Progress' ? 'On Court' : m.status;
  document.getElementById('mdStatus').className = 'status-pill ' + (m.status||'').replace(/\s+/g,'');

  const body = document.getElementById('mdBody');
  if (isBye) {
    const advancing = m.team1 === 'BYE' ? m.team2 : m.team1;
    body.innerHTML = `
      <div class="mm-bye">
        <div class="mm-photo-placeholder"></div>
        <div class="mm-team-name">${teamNameLines(advancing)}</div>
        <div class="mm-bye-label">Advances on a BYE</div>
      </div>`;
  } else if (isWalkoverMatch(m)) {
    const winnerTeam = m.winner || m.team1;
    body.innerHTML = `
      <div class="mm-photo-row">
        <div class="mm-photo-placeholder"></div>
        <div class="mm-photo-placeholder"></div>
      </div>
      <div class="scoreboard mm-scoreboard">
        <div class="sb-row ${winnerTeam===m.team1?'winner':''}"><div class="sb-names">${teamNameLines(m.team1)}</div></div>
        <div class="sb-row ${winnerTeam===m.team2?'winner':''}"><div class="sb-names">${teamNameLines(m.team2)}</div></div>
      </div>
      <div class="mm-bye-label" style="text-align:center;">Decided by walkover</div>`;
  } else {
    body.innerHTML = `
      <div class="mm-photo-row">
        <div class="mm-photo-placeholder"></div>
        <div class="mm-photo-placeholder"></div>
      </div>
      <div class="scoreboard mm-scoreboard">
        <div class="sb-row ${w1?'winner':''}">
          <div class="sb-names">${teamNameLines(m.team1)}</div>
          ${score.played ? `<div class="sb-sets">${score.a}</div>` : ''}
        </div>
        <div class="sb-row ${w2?'winner':''}">
          <div class="sb-names">${teamNameLines(m.team2)}</div>
          ${score.played ? `<div class="sb-sets">${score.b}</div>` : ''}
        </div>
      </div>`;
  }
  document.getElementById('mdStream').innerHTML = '<span class="mm-field-label">Live stream</span><div class="mm-field-placeholder">Link coming soon</div>';
  document.getElementById('mdInfo').innerHTML = '<span class="mm-field-label">Match info</span><div class="mm-field-placeholder">&mdash;</div>';

  document.getElementById('matchDrawerOverlay').classList.add('open');
  document.getElementById('matchDrawer').classList.add('open');
}
function closeMatchDrawer() {
  document.getElementById('matchDrawerOverlay').classList.remove('open');
  document.getElementById('matchDrawer').classList.remove('open');
}

function wireCardClicks(containerId) {
  const el = document.getElementById(containerId);
  el.addEventListener('click', e => {
    const card = e.target.closest('.match-card');
    if (card && card.dataset.num) openMatchDrawer(card.dataset.num);
  });
}

// ---------------------------------------------------------------------
// Tabs, filters & view toggle
// ---------------------------------------------------------------------
function showTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => {
    const shouldShow = p.id === 'panel-' + tab;
    if (shouldShow) {
      p.classList.remove('active'); void p.offsetWidth; p.classList.add('active');
    } else {
      p.classList.remove('active');
    }
  });
}
function refreshActivePanel() {
  renderGroups(document.getElementById('groupSearch').value);
  renderAllMatches(document.getElementById('matchSearch').value);
  renderPlayoff();
  renderRankings(document.getElementById('rankingSearch').value);
}
let userPickedView = false; // true once the visitor has clicked the Web/Mobile toggle themselves
function setView(view) {
  document.body.classList.toggle('view-mobile', view === 'mobile');
  document.body.classList.toggle('view-web', view === 'web');
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  renderAllMatches(document.getElementById('matchSearch').value);
}
function autoDetectView() {
  if (userPickedView) return;
  setView(window.innerWidth < 760 ? 'mobile' : 'web');
}

// ---------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------
async function init() {
  await loadData();
  renderDataNote();
  renderCourtFilter();
  refreshActivePanel();

  document.getElementById('groupSearch').addEventListener('input', e => renderGroups(e.target.value));
  document.getElementById('matchSearch').addEventListener('input', e => renderAllMatches(e.target.value));
  document.getElementById('rankingSearch').addEventListener('input', e => renderRankings(e.target.value));
  document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  document.querySelectorAll('.view-toggle button').forEach(b => b.addEventListener('click', () => { userPickedView = true; setView(b.dataset.view); }));
  document.querySelectorAll('#categoryFilter .pill-btn').forEach(b => b.addEventListener('click', () => {
    FILTERS.category = b.dataset.catf;
    document.querySelectorAll('#categoryFilter .pill-btn').forEach(x => x.classList.toggle('active', x === b));
    refreshActivePanel();
  }));
  document.querySelectorAll('#tierFilter .pill-btn').forEach(b => b.addEventListener('click', () => {
    FILTERS.tier = b.dataset.tierf;
    document.querySelectorAll('#tierFilter .pill-btn').forEach(x => x.classList.toggle('active', x === b));
    refreshActivePanel();
  }));
  document.querySelectorAll('#playoffViewToggle .pill-btn').forEach(b => b.addEventListener('click', () => {
    PLAYOFF_VIEW = b.dataset.playoffview;
    document.querySelectorAll('#playoffViewToggle .pill-btn').forEach(x => x.classList.toggle('active', x === b));
    renderPlayoff();
  }));
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
  document.getElementById('matchDrawerClose').addEventListener('click', closeMatchDrawer);
  document.getElementById('matchDrawerOverlay').addEventListener('click', closeMatchDrawer);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('matchDrawer').classList.contains('open')) closeMatchDrawer();
    else if (document.getElementById('drawer').classList.contains('open')) closeDrawer();
  });
  wireCardClicks('allMatchesList');
  wireCardClicks('playoffContent');
  wireCardClicks('drawerBody');

  autoDetectView();
  // Embedded contexts (e.g. an iframe on another site) can settle to their real
  // width slightly after this first check, or change width later (resize,
  // orientation change) -- keep following it instead of only checking once.
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(autoDetectView, 150);
  });
  window.addEventListener('orientationchange', () => setTimeout(autoDetectView, 150));

  if (CONFIG.groupsCsvUrl && CONFIG.matchesCsvUrl && CONFIG.playoffCsvUrl) {
    setInterval(async () => {
      await loadData();
      renderDataNote();
      renderCourtFilter();
      refreshActivePanel();
    }, CONFIG.refreshMs);
  }
}
init();

</script>
</body>
</html>
